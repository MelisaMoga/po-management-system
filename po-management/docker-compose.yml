version: '3.8'

services:
  db:
    image: postgres:15
    container_name: po_postgres
    environment:
      POSTGRES_USER: po_user
      POSTGRES_PASSWORD: po_password
      POSTGRES_DB: po_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po_user -d po_management"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
